<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Ooty Feeds</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f6f2e9;
      font-family: 'Outfit', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .login-card h2 {
      font-family: 'Fraunces', serif;
      color: #142720;
      margin-bottom: 8px;
    }
    .login-card p {
      color: #5a6a5e;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #142720;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid rgba(31, 58, 46, 0.2);
      border-radius: 8px;
      box-sizing: border-box;
      font-family: inherit;
    }
    .btn-submit {
      width: 100%;
      background: #142720;
      color: #c9a05c;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      font-size: 0.95rem;
      margin-top: 10px;
    }
    .alert {
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
    .alert-danger { background: #fee2e2; color: #dc2626; }
    .alert-info { background: #e0f2fe; color: #0284c7; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>🌿 Ooty Feeds</h2>
    <p>Admin Login Portal</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/admin/login">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="admin" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-submit">Log In</button>
    </form>
  </div>
</body>
</html>
